[package]
name = "lmoxide-api"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "LMOxide REST API: server administration and public information (for a web UI, Discord bots, scripts)"

[dependencies]
anyhow.workspace = true
axum.workspace = true
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
clap.workspace = true
lmoxide-content.workspace = true
lmoxide-control = { path = "../lmoxide-control" }
lmoxide-db = { path = "../lmoxide-db" }
rand = "0.9"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http = { workspace = true, features = ["cors", "trace", "timeout", "set-header", "compression-gzip", "compression-br"] }
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-axum = "0.3.0"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
