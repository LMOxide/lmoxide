syntax = "proto2";
message MinifigureCollection {
  message Minifigure {
    optional uint32 templateID = 1;
    optional uint32 series = 2;
    optional uint32 dropLocationTdbEntry = 3;
    optional uint32 dropLocationPicture = 4;
  }
  repeated MinifigureCollection.Minifigure MinifigureList = 1;
}
