syntax = "proto2";
import "ID32.proto";
message ProtoMoveInventoryItemIIR {
  required ProtoID32 source_container_id = 1;
  required uint32 source_item_pos = 2;
  required ProtoID32 destination_container_id = 3;
  required uint32 destination_item_pos = 4;
}
message ProtoDeleteItemIIR {
  required ProtoID32 container_id = 1;
  required uint32 item_pos = 2;
  required ProtoID32 template_id = 3;
}
