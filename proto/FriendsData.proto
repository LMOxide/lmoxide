syntax = "proto2";
import "PlayfieldProxyData.proto";
message FriendsData {
  message Friend {
    optional uint32 instance = 1;
    optional string name = 2;
    optional bool online = 3;
    optional uint32 faction = 4;
    optional PlayfieldProxyData proxy = 5;
    optional uint32 dimension = 6;
  }
  repeated FriendsData.Friend friends = 1;
}
