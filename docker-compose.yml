# LMOxide: one process (game server with every game mode, REST API, patch server) behind Caddy.
#   cp docker/.env.example .env && cp docker/lmoxide.example.toml docker/lmoxide.toml   (edit both)
#   docker compose up -d --build
# Admin commands: docker compose exec lmoxide lmoxide game account gm <user> 1
#                 docker compose exec lmoxide lmoxide api key create discord-bot --scope read

services:
  lmoxide:
    image: lmoxide:latest
    build: .
    restart: unless-stopped
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - data:/data
      - ./docker/lmoxide.toml:/etc/lmoxide/lmoxide.toml:ro
      - ${LMOXIDE_WINDOWS_CLIENT:?set LMOXIDE_WINDOWS_CLIENT in .env}:/clients/windows:ro
      - ${LMOXIDE_LINUX_CLIENT:?set LMOXIDE_LINUX_CLIENT in .env}:/clients/linux:ro
    ports:
      # the game modes' universe ports (Progression, Maxxed, World Editor), territory, game, chat:
      # raw TCP, published as they are
      - "7100:7100"
      - "7103:7103"
      - "7104:7104"
      - "7101:7101"
      - "7102:7102"
      - "7200:7200"
    # HTTP (API, patch server) on 8080 stays on the compose network: Caddy serves it with HTTPS
    stop_grace_period: 15s

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      LMOXIDE_PUBLIC_HOST: ${LMOXIDE_PUBLIC_HOST:?set LMOXIDE_PUBLIC_HOST in .env}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    ports:
      - "80:80"
      - "443:443"
    depends_on: [lmoxide]

  # The Discord bot (its own repository) talks to the API with a key:
  # discord-bot:
  #   image: lmoxide-discord-bot:latest
  #   environment:
  #     LMOXIDE_API: http://lmoxide:8080
  #     LMOXIDE_API_KEY_FILE: /run/secrets/discord_bot_key

volumes:
  data:
  caddy-data:
