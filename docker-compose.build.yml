# Builds the images from source instead of pulling them, for developers. The web UI, dev UI and
# bot are their own repositories, checked out next to this one (../lmoxide-webui, ...).
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.build.yml build lmoxide   (only one)
# The images report what they were built from (/v1/version, the bot's /version, the UIs'
# version.json) when the commit is in the environment (.git isn't copied into the builds):
#   export LMOXIDE_GIT_COMMIT=$(git rev-parse HEAD) LMOXIDE_GIT_COMMIT_TIME=$(git log -1 --format=%ct)
# and the other repositories' commits (in their checkouts) in LMOXIDE_WEBUI_COMMIT,
# LMOXIDE_DEV_UI_COMMIT and LMOXIDE_DISCORD_BOT_COMMIT.

services:
  lmoxide:
    image: lmoxide:latest
    build:
      context: .
      args:
        LMOXIDE_GIT_COMMIT: ${LMOXIDE_GIT_COMMIT:-}
        LMOXIDE_GIT_COMMIT_TIME: ${LMOXIDE_GIT_COMMIT_TIME:-}
  webui:
    image: lmoxide-webui:latest
    build:
      context: ../lmoxide-webui
      args:
        GIT_COMMIT: ${LMOXIDE_WEBUI_COMMIT:-}
  dev-ui:
    image: lmoxide-dev-ui:latest
    build:
      context: ../lmoxide-dev-ui
      args:
        GIT_COMMIT: ${LMOXIDE_DEV_UI_COMMIT:-}
  discord-bot:
    image: lmoxide-discord-bot:latest
    build:
      context: ../lmoxide-discord-bot
      args:
        GIT_COMMIT: ${LMOXIDE_DISCORD_BOT_COMMIT:-}
