# LMOxide in one process (lmoxide): copy to docker/lmoxide.toml and adjust.
# Each part's table takes that program's options without the leading `--`
# (lmoxide-server --help, lmoxide-api --help, lmoxide-patch-server --help).

# the database (accounts, characters) and the login key
data_dir = "/data"
# the host name players reach (game ports and HTTP); clients may use a name, as live did.
# The same as LMOXIDE_PUBLIC_HOST in .env; also change it in api-url and website below.
public_host = "lmo.example.org"

[http]
# the API (/v1/...), the patch server (/patch/, /control/, /lmoxide/v1/...) and the web files;
# Caddy in front adds HTTPS (docker/Caddyfile)
bind = "0.0.0.0:8080"
# a built web UI (lmoxide-webui's dist/), served for every other path. Not needed with
# docker-compose.yml: Caddy sends those paths to the web UI's own container.
# web_dir = "/srv/webui"

[game]
bind = "0.0.0.0"
# each game mode's universe port: the patcher's Game Mode picks one
modes = "progression:7100,maxed:7103,world-editor:7104"
# the world editor's content working copy (a git clone of the content repository)
editor-content-dir = "/data/content-work"
content-queue = "/data/content-queue"
# the story's teleport windows: "unlocked" (every window open, the default) or "locked" (a
# window opens as the character's story reaches it, as live)
# story-windows = "locked"
# who may play the Progression and Maxxed modes: 0 everyone, 1 alpha testers and staff (GM levels:
# 1 alpha tester, 2 contributor (world editor, every test command, god camera), 3 moderator,
# 4 admin; docs/SECURITY.md "Access levels")
play-gm-level = 0
# LAN conveniences; leave off on a public server
auto-register = false
default-gm-level = 0

[api]
# who may create accounts: "open" (anyone, POST /v1/auth/register), "discord" (only the
# Discord bot, for members of its server) or "closed" (only admins)
registration = "closed"
# behind Caddy: the client address comes from X-Forwarded-For
trust-forwarded-for = true

[patch]
server-name = "LMOxide"
client-dir = "/clients/windows"
linux-client-dir = "/clients/linux"
linux-overlay-dir = "/usr/local/share/lmoxide/linux-overlay"
# behind Caddy: the game client speaks plain HTTP, so its addresses use port 80 (Caddy serves the
# patch server's paths there without redirecting); LMOxide patchers may use HTTPS on 443
public-http-port = 80
public-https-port = 443
# announced to patchers: the API (their server status line) and the website (the web UI)
api-url = "https://lmo.example.org/api"
website = "https://lmo.example.org/"
# builds of the GUI patcher for its self-update (lmoxide-patcher-gui-<version>-<platform>[.exe]),
# from the PATCHER_DIR folder in .env; docs/HOSTING.md
patcher-dir = "/patchers"
upstream = "http://update.lego.funcom.com/legoupm"
